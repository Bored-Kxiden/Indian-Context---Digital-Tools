name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the Pages deployment needs write access.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install, build and upload
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # A project site lives at https://<owner>.github.io/<repo>/
          # For a custom domain, set BASE_PATH to "/" and SITE_URL to the domain.
          SITE_URL: https://bored-kxiden.github.io
          BASE_PATH: /Indian-Context---Digital-Tools

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
